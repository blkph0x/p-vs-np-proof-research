name: research-checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: research-checks
  # Let an active mathematical replay finish when a new revision is pushed.
  # GitHub still replaces an older pending run with the newest pending run.
  cancel-in-progress: false

jobs:
  focused-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check method coverage and optimization-independent proof checking
        run: |
          python build_public_method_inventory.py --check
          cd proof_producing_cdcl_lab
          python -m unittest -v test_cdcl.py test_review_validation.py
          python -O -m unittest -v test_review_validation.py
      - name: Replay public SAT evidence without installing a search backend
        working-directory: proof_producing_cdcl_lab
        run: |
          python run_public_sat.py --replay PUBLIC_SAT_BASELINE
          python -m unittest -v test_rup_verify test_public_sat_certificate test_public_sat_evidence
          python -O -m unittest -v test_rup_verify test_public_sat_certificate test_public_sat_evidence
      - name: Check exact local Fourier precomputation
        working-directory: affine_character_factor_lab
        run: |
          python -m unittest discover -v
          python INDEPENDENT_REVIEW.py
      - name: Run focused certificate checks
        run: |
          python fourier_spectrum_boundary_lab/run_experiments.py
          python fourier_spectrum_boundary_lab/verify_fourier_boundary.py
          python -m unittest -v test_fourier_spectrum_boundary_integration.py
          set +e
          python run_holographic_phase_checks.py
          status=$?
          if [ "$status" -ne 0 ]; then
            cat HOLOGRAPHIC_TEST_OUTPUT.txt
            exit "$status"
          fi
          python verify_holographic_artifacts.py
      - name: Replay uniform PHP width certificate
        working-directory: resolution_width_lab
        run: |
          python run_php_width.py
          python review_php_width_proof.py
      - name: Replay full FWHT-Zeta cost audit
        working-directory: fourier_spectrum_boundary_lab
        run: |
          python run_fwht_cost.py
          python review_fwht_cost.py
      - name: Replay hidden XOR motif audit
        working-directory: proof_motif_candidate_lab
        run: |
          python run_indirect_xor.py
          python review_indirect_xor.py
      - name: Replay compact ITE motif audit
        working-directory: proof_motif_candidate_lab
        run: |
          python run_indirect_ite.py
          python review_indirect_ite.py
      - name: Replay bounded XOR-chain closure audit
        working-directory: proof_motif_candidate_lab
        run: |
          python run_xor_closure.py
          python review_xor_closure.py
      - name: Replay hidden-affine representation discovery experiment
        working-directory: representation_discovery_lab
        run: |
          # Preserve committed inputs so regeneration cannot conceal corruption.
          python independent_review.py
          python -m unittest discover -v
      - name: Replay affine-projection recognition reduction
        working-directory: affine_projection_recognition_lab
        run: |
          # Check committed evidence before any regeneration.
          python review_quantified_boundary.py
          python review_affine_hull.py
          python -m unittest -v test_lab.py test_quantified_boundary.py test_hull_engine.py test_hull_certificate.py
          python -O -m unittest -v test_hull_certificate.py
      - name: Replay sparse parity clause hierarchy comparison
        working-directory: local_marginal_code_lab
        run: |
          python review_sparse_parity_clause_comparison.py
          python -m unittest -v test_sparse_parity_clause_comparison.py
      - name: Replay fresh exact LP discovery without trusting the backend
        working-directory: local_marginal_code_lab
        run: |
          python run_exact_lp_discovery.py --replay EXACT_LP_DISCOVERY
          python -m unittest -v test_exact_lp_model test_exact_lp_verify test_exact_lp_soplex
          python -O -m unittest -v test_exact_lp_verify test_exact_lp_soplex
      - name: Check quadratic Reed-Muller family and exhaustive scope classification
        working-directory: local_marginal_code_lab
        run: |
          python -m unittest -v test_rm2_level8_family
          python review_rm2_level8_family.py
      - name: Reconstruct and replay the nine-scope discovery
        working-directory: local_marginal_code_lab
        run: |
          python run_rm2_nine_scope.py --replay RM2_NINE_SCOPE_DISCOVERY
          python -m unittest -v test_rm2_nine_scope test_rm2_level9_family
          python -O -m unittest -v test_rm2_nine_scope test_rm2_level9_family
      - name: Check the strict locality-ten lower bound
        working-directory: local_marginal_code_lab
        run: |
          python -m unittest -v test_rm2_level10_control
          python -O -m unittest -v test_rm2_level10_control
      - name: Replay prefix-threshold sequential-counter audit
        working-directory: proof_motif_candidate_lab
        run: |
          python run_sequential_counter.py
          python review_sequential_counter.py
      - name: Replay deterministic Reed-Muller local-marginal audit
        working-directory: local_marginal_code_lab
        run: |
          python run_reed_muller.py
          python REED_MULLER_INDEPENDENT_REVIEW.py
          python -m unittest -v test_local_marginal.py test_reed_muller.py
      - name: Replay all-dual Reed-Muller parity audit
        working-directory: local_marginal_code_lab
        run: |
          python run_all_dual_reed_muller.py
          python REED_MULLER_ALL_DUAL_INDEPENDENT_REVIEW.py
          python -m unittest -v test_all_dual_reed_muller.py
      - name: Replay all-dual plus local-marginal Reed-Muller audit
        working-directory: local_marginal_code_lab
        run: |
          python run_all_dual_local_reed_muller.py
          python REED_MULLER_ALL_DUAL_LOCAL_INDEPENDENT_REVIEW.py
          python -m unittest -v test_all_dual_local_reed_muller.py
      - name: Replay level-d Reed-Muller boundary certificate
        working-directory: local_marginal_code_lab
        run: |
          python REED_MULLER_LEVEL_D_INDEPENDENT_REVIEW.py
          python -m unittest -v test_reed_muller_level_d.py
      - name: Replay RM(2,5) affine-flat star control
        working-directory: local_marginal_code_lab
        run: |
          python run_reed_muller_level_d_flat_star.py
          python REED_MULLER_LEVEL_D_FLAT_STAR_INDEPENDENT_REVIEW.py
          python -m unittest -v test_reed_muller_level_d_flat_star.py
      - name: Replay RM(2,5) affine-overlap lower bound
        working-directory: local_marginal_code_lab
        run: |
          python run_reed_muller_level_d_affine_overlap.py
          python REED_MULLER_LEVEL_D_AFFINE_OVERLAP_INDEPENDENT_REVIEW.py
          python -m unittest -v test_reed_muller_level_d_affine_overlap.py
      - name: Replay full RM(2,5) level-eight quotient
        working-directory: local_marginal_code_lab
        run: |
          python run_reed_muller_level_d_full.py
          python REED_MULLER_LEVEL_D_FULL_INDEPENDENT_REVIEW.py
          python REED_MULLER_OBJECTIVE_NORMALIZATION_AUDIT.py
          python -m unittest -v test_reed_muller_level_d_full.py
      - name: Replay RM(2,5) SOS moment separation
        working-directory: local_marginal_code_lab
        run: |
          python run_reed_muller_sos_moment.py
          python REED_MULLER_SOS_MOMENT_INDEPENDENT_REVIEW.py
          python -m unittest -v test_reed_muller_sos_moment.py
      - name: Replay SOS-strengthened RM(2,5) bracket
        working-directory: local_marginal_code_lab
        run: |
          python run_reed_muller_sos_strengthened.py
          python REED_MULLER_SOS_STRENGTHENED_INDEPENDENT_REVIEW.py
          python -m unittest -v test_reed_muller_sos_strengthened.py
      - name: Replay two-cut SOS RM(2,5) certificate
        working-directory: local_marginal_code_lab
        run: |
          python run_reed_muller_sos_two_cut.py
          python REED_MULLER_SOS_TWO_CUT_INDEPENDENT_REVIEW.py
          python -m unittest -v test_reed_muller_sos_two_cut.py
      - name: Replay three-cut SOS RM(2,5) certificate
        working-directory: local_marginal_code_lab
        run: |
          python run_reed_muller_sos_three_cut.py
          python REED_MULLER_SOS_THREE_CUT_INDEPENDENT_REVIEW.py
          python -m unittest -v test_reed_muller_sos_three_cut.py
      # The full audit below runs the four-, five-, and six-cut suites. Keep the
      # newest exact replay focused here without executing those older expensive
      # producer/reviewer pairs twice on every push.
      - name: Replay seven-cut SOS RM(2,5) certificate
        working-directory: local_marginal_code_lab
        run: |
          python run_reed_muller_sos_seven_cut.py
          python REED_MULLER_SOS_SEVEN_CUT_INDEPENDENT_REVIEW.py
          python -m unittest -v test_reed_muller_sos_seven_cut.py
      - name: Replay RM(2,5) candidate-cut separation scan
        working-directory: local_marginal_code_lab
        run: |
          python run_reed_muller_sos_candidate_scan.py
          python REED_MULLER_SOS_CANDIDATE_SCAN_INDEPENDENT_REVIEW.py
          python -m unittest -v test_reed_muller_sos_candidate_scan.py
      - name: Replay odd-charge Tseitin expander campaign
        working-directory: tseitin_expander_lab
        run: |
          # RESULTS.json contains frozen wall-clock observations used by the
          # public runtime chart. Re-running the producer would replace those
          # measurements with runner-dependent timings and invalidate the
          # chart's source binding. The independent replay and tests below
          # rebuild the graph, parity, CNF, and proof semantics from the
          # committed artifact without mutating it.
          python INDEPENDENT_REVIEW.py
          python review_expansion_profile.py
          python -m unittest -v test_tseitin.py
      - name: Run the self-contained full audit
        run: |
          set +e
          python run_research_checks.py
          status=$?
          if [ "$status" -ne 0 ]; then
            cat TEST_OUTPUT.txt
            exit "$status"
          fi
