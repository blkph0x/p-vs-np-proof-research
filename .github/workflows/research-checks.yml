name: research-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  focused-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run focused certificate checks
        run: |
          python fourier_spectrum_boundary_lab/run_experiments.py
          python fourier_spectrum_boundary_lab/verify_fourier_boundary.py
          python -m unittest -v test_fourier_spectrum_boundary_integration.py
          set +e
          python run_holographic_phase_checks.py
          status=$?
          if [ "$status" -ne 0 ]; then
            cat HOLOGRAPHIC_TEST_OUTPUT.txt
            exit "$status"
          fi
          python verify_holographic_artifacts.py
      - name: Run the self-contained full audit
        run: |
          set +e
          python run_research_checks.py
          status=$?
          if [ "$status" -ne 0 ]; then
            cat TEST_OUTPUT.txt
            exit "$status"
          fi
